name = "cf-ai-agents-memory-demo"
main = "src/worker.ts"
compatibility_date = "2024-11-15"
compatibility_flags = ["nodejs_compat"]

# Serve static assets from ./frontend
assets = { directory = "./frontend" }

[ai]
binding = "AI"

[durable_objects]
bindings = [
  { name = "MEMORY_DO", class_name = "MemoryDO" }
]

[migrations]
# wrangler will append migrations here automatically after first deploy
